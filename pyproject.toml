[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vatra-core"
version = "0.5.0"
description = "Open-source Physical AI & Edge Vision platform for lightweight, real-time spatial intelligence."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Vantara Intech" },
]
keywords = [
  "physical-ai",
  "edge-ai",
  "computer-vision",
  "spatial-intelligence",
  "onnx",
  "tensorrt",
  "nvidia-jetson",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
vision = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]
onnx = [
  "onnxruntime>=1.18",
]
cuda = [
  "onnxruntime-gpu>=1.18",
]
directml = [
  "onnxruntime-directml>=1.20",
]
yaml = [
  "pyyaml>=6.0",
]
all = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.18",
  "pyyaml>=6.0",
]

[project.scripts]
vatra = "vatra.cli:main"

[project.urls]
Homepage = "https://github.com/rozzulabil-dev/vatra-core"
Repository = "https://github.com/rozzulabil-dev/vatra-core"
Issues = "https://github.com/rozzulabil-dev/vatra-core/issues"

[tool.setuptools.packages.find]
where = ["src"]
